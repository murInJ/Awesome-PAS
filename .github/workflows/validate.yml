name: Validate Markdown

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate bilingual Markdown tables
        run: python scripts/validate_markdown.py
      - name: Test Markdown parser
        run: |
          node tests/parser.test.mjs
          node tests/data-integration.test.mjs
