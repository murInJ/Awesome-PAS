name: Add a paper
about: Suggest a palm authentication security paper
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Primary paper URL or DOI
    validations:
      required: true
  - type: dropdown
    id: collection
    attributes:
      label: Collection
      options:
        - Physical presentation attack detection
        - Digital and injection attacks
        - Physiological liveness
        - Attack generation
        - Dataset or benchmark
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Verified metadata
      description: Venue, year, trait, modality, attacks, setting, dataset, code and access status.
    validations:
      required: true
