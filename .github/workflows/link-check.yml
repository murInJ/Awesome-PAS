name: Check Links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
  pull_request:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-mail README.md README.zh-CN.md "**/*.md"
          fail: true
